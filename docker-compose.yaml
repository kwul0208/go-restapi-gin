version: '2.24.5'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=db_go_restapi_gin
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: go_restapi_gin_mysql
    ports: 
      - "3306:3306"
    expose:
      - '3306'
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: db_go_restapi_gin
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: